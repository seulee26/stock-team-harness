<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title · 리서치 리포트</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #191f28;
      --body: #333d4b;
      --muted: #6b7684;
      --faint: #8b95a1;
      --blue: #3182f6;
      --blue-ink: #1b64da;
      --tint: #e8f3ff;
      --line: #e5e8eb;
      --fill: #f2f4f6;
      --paper: #fff;
      --up: #f04452;
      --radius: 24px;
      --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; color: var(--body); background: var(--fill); font: 17px/1.7 var(--font); -webkit-font-smoothing: antialiased; }
    a { color: var(--blue-ink); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: .18em; }
    a:focus-visible, .table-wrap:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 6px; }
    h1, h2, h3, p, dl, dd { margin: 0; }
    h1, h2, h3 { color: var(--ink); line-height: 1.32; letter-spacing: -.03em; text-wrap: balance; }
    h1, h2, h3, p, dt, dd, th, td { word-break: keep-all; overflow-wrap: break-word; line-break: strict; }
    p { text-wrap: pretty; }
    p + p { margin-top: .75em; }
    .measure { font-variant-numeric: tabular-nums; white-space: nowrap; }

    .report { max-width: 760px; margin: 0 auto; padding: 44px 20px 56px; }
    .masthead { padding: 0 8px 22px; }
    .report-type { display: inline-block; padding: 6px 12px; border-radius: 999px; background: var(--tint); color: var(--blue-ink); font-size: .82rem; font-weight: 700; }
    .masthead h1 { margin: 14px 0 8px; font-size: clamp(1.9rem, 6vw, 2.5rem); font-weight: 800; letter-spacing: -.045em; }
    .as-of { color: var(--muted); font-size: .92rem; }
    .report-body > * + *, .analysis > * + *, aside > * + * { margin-top: 14px; }

    .thesis, .timing, .section, .panel, .team, .sources, .market-context { padding: 28px; border-radius: var(--radius); background: var(--paper); }
    .thesis::before { content: "한 줄 결론"; display: block; margin-bottom: 10px; color: var(--blue-ink); font-size: .86rem; font-weight: 700; }
    .thesis h2 { margin-bottom: 12px; font-size: clamp(1.45rem, 4.6vw, 1.9rem); font-weight: 800; letter-spacing: -.04em; }
    .thesis p { color: var(--body); }

    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .metric { min-width: 0; padding: 20px; border-radius: 20px; background: var(--paper); }
    .metric dt { color: var(--muted); font-size: .88rem; font-weight: 600; }
    .metric-value { margin: 6px 0 6px; color: var(--ink); font-size: clamp(1.4rem, 4vw, 1.8rem); font-weight: 800; line-height: 1.2; letter-spacing: -.04em; }
    .metric-note { color: var(--faint); font-size: .82rem; line-height: 1.5; }

    .timing h2, .section h2, .panel h2, .team h2, .sources h2, .market-context h2 { margin-bottom: 14px; font-size: 1.22rem; font-weight: 750; }
    .timing ul { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
    .timing li { display: grid; gap: 8px; padding: 18px 20px; border-radius: 18px; background: var(--fill); }
    .timing li:first-child { background: var(--tint); }
    .timing h3 { justify-self: start; padding: 4px 11px; border-radius: 999px; background: var(--paper); color: var(--muted); font-size: .82rem; font-weight: 700; letter-spacing: 0; }
    .timing li:first-child h3 { background: var(--blue); color: #fff; }
    .timing-trigger { color: var(--ink); font-size: 1.06rem; font-weight: 750; line-height: 1.45; letter-spacing: -.02em; }
    .timing li p + p { margin-top: 4px; }
    .timing li div > p:not(.timing-trigger) { color: var(--body); font-size: .95rem; }
    .timing-note { margin-top: 14px; color: var(--faint); font-size: .86rem; }
    .timing-note p + p { margin-top: .3em; }

    .columns { display: block; }
    .section p { color: var(--body); }
    aside { display: grid; gap: 14px; margin-top: 14px; }
    .panel { background: var(--paper); }
    .panel ul { margin: 0; padding: 0; list-style: none; }
    .panel li + li, .panel dl > div + div { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
    .panel h3, .panel dt { color: var(--ink); font-size: 1rem; font-weight: 700; letter-spacing: -.02em; }
    .panel p, .panel dd { margin-top: 3px; color: var(--muted); font-size: .93rem; }

    .table-wrap { max-width: 100%; overflow-x: auto; margin-top: 16px; border-radius: 16px; border: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    caption { padding: 14px 16px 10px; text-align: left; color: var(--ink); font-weight: 700; }
    th, td { padding: 11px 16px; text-align: left; vertical-align: top; border-top: 1px solid var(--line); }
    thead th { background: var(--fill); color: var(--muted); font-size: .84rem; font-weight: 600; white-space: nowrap; }
    tbody th { color: var(--ink); font-weight: 650; }
    td { font-variant-numeric: tabular-nums; }

    .refs { display: inline; margin-inline-start: .3em; font-size: .7em; white-space: nowrap; vertical-align: super; line-height: 0; }
    .refs a { color: var(--blue-ink); font-weight: 700; }
    .refs a + a { margin-inline-start: .2em; }
    .evidence { margin-top: 12px; color: var(--faint); font-size: .84rem; }
    .team dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .team dl > div { padding: 14px 16px; border-radius: 14px; background: var(--fill); font-size: .92rem; }
    .team dt { color: var(--ink); font-weight: 700; }
    .team dd { margin-top: 2px; color: var(--muted); }
    .sources { background: transparent; padding: 20px 8px 0; }
    .sources h2 { font-size: 1rem; color: var(--muted); }
    .sources ol { margin: 0; padding-inline-start: 1.4em; color: var(--faint); font-size: .84rem; }
    .sources li { overflow-wrap: anywhere; }
    .sources li + li { margin-top: .25em; }
    .sources li:target { background: var(--tint); border-radius: 6px; }
    .sources a { color: var(--muted); }
    .disclaimer { margin: 18px 8px 0; color: var(--faint); font-size: .82rem; line-height: 1.6; }

    @media screen and (max-width: 680px) {
      body { font-size: 16px; }
      .report { padding: 28px 12px 40px; }
      .thesis, .timing, .section, .panel, .team, .sources, .market-context { padding: 22px 20px; border-radius: 20px; }
      .sources { padding: 16px 8px 0; }
      .team dl { grid-template-columns: minmax(0, 1fr); }
      .timing li { padding: 16px; }
    }

    @media screen and (max-width: 530px) {
      .metrics { grid-template-columns: minmax(0, 1fr); gap: 8px; }
      .metric { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; column-gap: 10px; padding: 16px 18px; border-radius: 16px; }
      .metric-value { margin: 0; font-size: 1.35rem; }
      .metric-note { grid-column: 1 / -1; margin-top: 4px; }
      th, td { padding: 10px 12px; }
      td .measure { white-space: normal; }
    }

    @media print {
      @page {
        size: A4;
        margin: 14mm 15mm 16mm;
        @bottom-right { content: counter(page) " / " counter(pages); color: #8b95a1; font: 9pt system-ui; }
      }
      body { font-size: 10.5pt; line-height: 1.55; background: #fff; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .report { max-width: none; margin: 0; padding: 0; }
      .masthead { padding: 0 0 10pt; }
      .masthead h1 { font-size: 22pt; margin: 6pt 0 3pt; }
      .report-body > * + *, .analysis > * + *, aside > * + * { margin-top: 8pt; }
      .thesis, .timing, .section, .panel, .team, .market-context { padding: 12pt 14pt; border-radius: 12pt; border: 1px solid var(--line); }
      .thesis { background: var(--tint); border-color: transparent; }
      .thesis h2 { font-size: 16pt; margin-bottom: 5pt; }
      .metrics { gap: 6pt; break-inside: avoid; }
      .metric { padding: 9pt 10pt; border-radius: 10pt; border: 1px solid var(--line); }
      .metric-value { font-size: 15pt; margin: 2pt 0; }
      .timing h2, .section h2, .panel h2, .team h2, .sources h2, .market-context h2 { margin-bottom: 6pt; font-size: 12.5pt; }
      .timing ul { gap: 5pt; }
      .timing li { padding: 8pt 10pt; border-radius: 9pt; gap: 4pt; }
      aside { margin-top: 8pt; gap: 8pt; }
      .table-wrap { overflow: visible; margin-top: 7pt; border-radius: 8pt; }
      th, td { padding: 4.5pt 7pt; }
      h2, h3, caption { break-after: avoid; }
      p { orphans: 2; widows: 2; }
      .timing li, .panel, tr, .team dl > div, .sources li, .metric, .section, .team, .thesis, .table-wrap { break-inside: avoid; }
      .team dl { gap: 5pt; }
      .team dl > div { padding: 6pt 8pt; border-radius: 7pt; }
      .sources { padding: 8pt 0 0; }
      .sources ol { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2pt 16pt; font-size: 8.5pt; }
      .sources li + li { margin-top: 0; }
      .disclaimer { margin: 8pt 0 0; font-size: 8.5pt; }
    }
  </style>
</head>
<body>
  <main class="report$report_class" aria-labelledby="report-title">
    <header class="masthead">
      <p class="report-type">$kind</p>
      <h1 id="report-title">$title</h1>
      <p class="as-of">$as_of</p>
    </header>
    <div class="report-body">
      <section class="thesis" aria-labelledby="thesis-title">
        <h2 id="thesis-title">$headline</h2>
        $summary
      </section>
      $metrics
      $timing
      <div class="columns$column_class">
        <div class="analysis">
          $sections
        </div>
        $aside
      </div>
      $team
      $sources
      <p class="disclaimer">이 리포트는 공개 자료를 정리한 조사 자료이며 투자 조언이나 권유가 아닙니다. 투자 판단과 책임은 본인에게 있습니다.</p>
    </div>
  </main>
</body>
</html>
