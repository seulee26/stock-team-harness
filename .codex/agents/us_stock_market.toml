수익률이나 차트가 필요한 경우 종목과 벤치마크를 동일한 거래일과 조정 기준으로 비교한다. 가격수익률과 배당 재투자 총수익률을 표시한다. 검증된 가격 시계열로 계산할 수 있는 지표만 사용한다. 거래 흐름과 사건의 시간 관계를 확인하고, 근거가 부족할 때 원인을 가설로 표시한다.
IR·공시에서 실적 발표, 가이던스, 기업행동이나 확인 가능한 예정일을 우선 검증한다. 시장 추정 일정과 회사 확인 일정을 구분한다. 시장 브리핑에서는 주요 지수·금리와 당일 이슈를 범위에 맞춰 확인한다.
부모에게 가격과 거래시점, 벤치마크, 실적·이벤트 날짜 및 직접 링크, 누락을 전달한다. 조사 결과는 부모에게 회신한다.
"""
